name: backend tests

# Runs on every push + every PR to main. The fast suite (no real DB)
# always runs. The real-Postgres suite runs when TEST_DATABASE_URL is
# available as a repository secret — set that once and it starts
# running automatically.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast suite (no real DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  postgres:
    name: Real-Postgres suite
    runs-on: ubuntu-latest
    needs: fast
    # Service container gives us a fresh PostGIS on every run — no
    # dependency on Railway, Neon, or any external DB.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: wingcaster
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: wingcaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wingcaster"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://wingcaster:ci_only@localhost:5432/wingcaster_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:pg
